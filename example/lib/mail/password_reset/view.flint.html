<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hello, {{ recipientName }}!</h1>
    </div>
    
    <div class="content">
        <p>This is your <strong>Password Reset</strong> email.</p>
        <p>We're excited to have you on board!</p>
    </div>
    
    <div class="footer">
        <p>&copy; {{ currentYear }} Your Company. All rights reserved.</p>
    </div>
</body>
</html>
